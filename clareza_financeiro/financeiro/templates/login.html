{# Tela de entrada: apresenta o formulário de autenticação do Django dentro do layout compartilhado. #}
{% extends 'base.html' %}{% block content %}<div class="login">
    <p class="eyebrow">BEM-VINDO AO SEU ESPAÇO</p>
    <h1>Mais leveza.<br>Mais clareza.</h1>
    <p>Entre para organizar seus pagamentos.</p>
    <section class="panel form-panel">
        <form method="post">{% csrf_token %}{{ form.as_p }}<button>Entrar na minha conta →</button></form>
    </section>
</div>{% endblock %}
